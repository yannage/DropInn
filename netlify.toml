[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public identifiers imported as protected dashboard values; neither is a credential.
  # API keys, webhook secrets and all other values remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "PADDLE_ENVIRONMENT,PADDLE_SUPPORTER_PRICE_ID"

[[redirects]]
  from = "/api/dropinn"
  to = "/.netlify/functions/dropinn"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/refunds"
  to = "/refunds.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
